apiVersion: apps/v1
kind: Deployment
metadata:
  name: generator-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: generator-api
  template:
    metadata:
      labels:
        app: generator-api
    spec:
      containers:
        - name: generator-api
          image: victodomvar/scaffoldops-generator-api:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ARTIFACT_CLEANUP_REQUESTED_TOPIC
              value: "artifact-cleanup-requested"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_GENERATOR_API_PASSWORD
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
