name: Deploy generator-api to Kubernetes

on:
  workflow_call:
    inputs:
      namespace:
        required: true
        type: string
      environment_name:
        required: true
        type: string
      spring_profile:
        required: true
        type: string
      image_version:
        required: true
        type: string

jobs:
  deploy:
    runs-on: self-hosted
    environment: ${{ inputs.environment_name }}
    env:
      NAMESPACE: ${{ inputs.namespace }}
      ENVIRONMENT_NAME: ${{ inputs.environment_name }}
      SPRING_PROFILE: ${{ inputs.spring_profile }}
      IMAGE_NAME: victodomvar/scaffoldops-generator-api
      IMAGE_VERSION: ${{ inputs.image_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.32.0

      - name: Render application manifests
        shell: bash
        run: |
          set -euo pipefail
          case "${NAMESPACE}:${ENVIRONMENT_NAME}:${SPRING_PROFILE}" in
            scaffoldops-dev:DEV:dev|scaffoldops-pre:PRE:pre) ;;
            *) echo "Unsupported namespace/environment/profile combination" >&2; exit 1 ;;
          esac
          [[ "${IMAGE_VERSION}" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]

          RENDER_DIR="$(mktemp -d k8s/.render-XXXXXX)"
          trap 'rm -rf -- "${RENDER_DIR}"' EXIT
          printf 'apiVersion: kustomize.config.k8s.io/v1beta1\nkind: Kustomization\nresources:\n  - ../overlays/%s\nimages:\n  - name: %s\n    newTag: "%s"\n' \
            "${SPRING_PROFILE}" "${IMAGE_NAME}" "${IMAGE_VERSION}" > "${RENDER_DIR}/kustomization.yaml"
          kubectl kustomize "${RENDER_DIR}" > "${RUNNER_TEMP}/generator-api.yaml"
          if [[ "${SPRING_PROFILE}" == pre ]] && grep -Eiq 'scaffoldops-dev|keycloak-dev|:develop|value: "?dev"?$' "${RUNNER_TEMP}/generator-api.yaml"; then
            echo "PRE manifests contain DEV configuration" >&2
            exit 1
          fi

      - name: Deploy application
        shell: bash
        run: |
          set -euo pipefail
          kubectl config use-context minikube
          kubectl cluster-info

          kubectl get namespace "${NAMESPACE}" >/dev/null 2>&1 || kubectl create namespace "${NAMESPACE}"
          kubectl get secret postgres-credentials -n "${NAMESPACE}" >/dev/null

          kubectl apply -n "${NAMESPACE}" -f "${RUNNER_TEMP}/generator-api.yaml"
          kubectl rollout status deployment/generator-api-deployment -n "${NAMESPACE}" --timeout=600s
          kubectl wait --for=condition=ready pod -l app=generator-api -n "${NAMESPACE}" --timeout=600s
