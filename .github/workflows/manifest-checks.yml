name: Generator API Manifest Checks

on:
  workflow_call:

jobs:
  manifests:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install manifest test dependency
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Check DEV and PRE deployment contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s scripts/tests -v
