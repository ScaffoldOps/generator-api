openapi: 3.0.3
info:
  title: ScaffoldOps Generator API
  description: API for submitting and tracking scaffold generation requests.
  version: "0.0.1-SNAPSHOT"
servers:
  - url: /api/generator/v1
    description: Base API path
tags:
  - name: GenerationRequest
    description: Public operations for scaffold generation requests.
  - name: InternalGenerationRequest
    description: Internal service-to-service operations. Not intended for use by end clients.
paths:
  /generation-requests:
    post:
      tags:
        - GenerationRequest
      operationId: createGenerationRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGenerationRequestRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationRequestResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - GenerationRequest
      operationId: listGenerationRequests
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: template
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/GenerationRequestStatus'
        - name: deploymentTarget
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DeploymentTarget'
        - name: database
          in: query
          required: false
          schema:
            type: boolean
        - name: restApi
          in: query
          required: false
          schema:
            type: boolean
        - name: security
          in: query
          required: false
          schema:
            type: boolean
        - name: messaging
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GenerationRequestResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /generation-requests/{id}:
    get:
      tags:
        - GenerationRequest
      operationId: getGenerationRequestById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationRequestResponse'
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - GenerationRequest
      operationId: deleteGenerationRequestById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No Content
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /internal/generation-requests/{requestId}/status:
    patch:
      tags:
        - InternalGenerationRequest
      summary: Update generation request status
      description: Internal callback used by generator-worker to report generation progress and results. Not part of the public client API.
      operationId: updateGenerationRequestStatus
      parameters:
        - name: requestId
          in: path
          required: true
          description: Generation request identifier.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerationStatusUpdateRequest'
      responses:
        '204':
          description: Generation request status updated
        '400':
          description: Invalid request identifier or status update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Generation request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    DeploymentTarget:
      type: string
      enum:
        - KUBERNETES
    GenerationRequestStatus:
      type: string
      enum:
        - RECEIVED
        - GENERATING
        - GENERATED
        - DEPLOYING
        - DEPLOYED
        - FAILED
    CreateGenerationRequestRequest:
      type: object
      required:
        - name
        - template
        - deploymentTarget
      properties:
        name:
          type: string
          minLength: 1
        template:
          type: string
          minLength: 1
        database:
          type: boolean
        restApi:
          type: boolean
        security:
          type: boolean
        messaging:
          type: boolean
        deploymentTarget:
          $ref: '#/components/schemas/DeploymentTarget'
    GenerationStatusUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: Current status reported by generator-worker.
          enum:
            - GENERATING
            - GENERATED
            - FAILED
        message:
          type: string
          description: Optional progress or failure detail.
        artifactRef:
          type: string
          description: Optional reference to the generated artifact.
        imageRef:
          type: string
          description: Optional reference to the generated container image.
    GenerationRequestResponse:
      type: object
      required:
        - id
        - name
        - template
        - deploymentTarget
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        template:
          type: string
        database:
          type: boolean
        restApi:
          type: boolean
        security:
          type: boolean
        messaging:
          type: boolean
        deploymentTarget:
          $ref: '#/components/schemas/DeploymentTarget'
        status:
          $ref: '#/components/schemas/GenerationRequestStatus'
        message:
          type: string
          nullable: true
        artifactRef:
          type: string
          nullable: true
        imageRef:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
        - message
        - timestamp
      properties:
        message:
          type: string
        timestamp:
          type: string
          format: date-time
